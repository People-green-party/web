<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="bgGrad6" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#032115"/>
      <stop offset="50%" stop-color="#053b24"/>
      <stop offset="100%" stop-color="#02170e"/>
    </linearGradient>
    <linearGradient id="accentGrad6" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow6" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#bgGrad6)"/>
  <path d="M0 40H400M0 80H400M0 120H400M0 160H400M0 200H400M80 0V240M160 0V240M240 0V240M320 0V240" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <circle cx="200" cy="105" r="65" fill="#22c55e" opacity="0.15" filter="url(#glow6)"/>

  <!-- Rocket Launching from Startup Desk -->
  <g transform="translate(140, 35)">
    <!-- Rocket Body -->
    <path d="M60 10C60 10 90 35 90 70V100L60 90L30 100V70C30 35 60 10 60 10Z" fill="url(#accentGrad6)" stroke="#ffffff" stroke-width="2"/>
    
    <!-- Rocket Window -->
    <circle cx="60" cy="50" r="14" fill="#032115" stroke="#ffffff" stroke-width="3"/>
    <circle cx="60" cy="50" r="6" fill="#38bdf8"/>

    <!-- Rocket Fins -->
    <path d="M30 75L10 95V105L30 95V75Z" fill="#ec4899"/>
    <path d="M90 75L110 95V105L90 95V75Z" fill="#ec4899"/>

    <!-- Thrust Flame -->
    <path d="M45 98L60 130L75 98Q60 110 45 98Z" fill="#f97316"/>
    <path d="M52 98L60 118L68 98Q60 105 52 98Z" fill="#fde047"/>
  </g>

  <!-- Label Badge -->
  
  
</svg>
