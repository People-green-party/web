<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#032115"/>
      <stop offset="50%" stop-color="#053b24"/>
      <stop offset="100%" stop-color="#02170e"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="240" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Subtle Grid Pattern -->
  <path d="M0 40H400M0 80H400M0 120H400M0 160H400M0 200H400M80 0V240M160 0V240M240 0V240M320 0V240" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <!-- Radial Glow Behind Icon -->
  <circle cx="200" cy="110" r="70" fill="#22c55e" opacity="0.15" filter="url(#glow)"/>

  <!-- Campus Building Silhouette -->
  <path d="M120 180H280V130L200 90L120 130V180Z" fill="#ffffff" fill-opacity="0.06"/>
  <path d="M180 180H220V145H180V180Z" fill="#22c55e" fill-opacity="0.2"/>

  <!-- Graduation Cap (Main Icon) -->
  <g transform="translate(140, 50)">
    <!-- Base Cap Diamond -->
    <path d="M60 10L115 38L60 66L5 38L60 10Z" fill="url(#accentGrad)" stroke="#ffffff" stroke-width="2.5"/>
    <path d="M60 20L100 40L60 60L20 40L60 20Z" fill="#ffffff" fill-opacity="0.2"/>
    
    <!-- Cap Under Base -->
    <path d="M28 52V76C28 88 92 88 92 76V52" fill="#032115" stroke="url(#accentGrad)" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Tassel -->
    <path d="M110 40V75C110 82 118 82 118 75V70" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="118" cy="78" r="5" fill="#22c55e"/>
  </g>

  <!-- Stars / Academic Accents -->
  <path d="M80 70L83 77L90 78L85 83L86 90L80 86L74 90L75 83L70 78L77 77L80 70Z" fill="#22c55e" opacity="0.8"/>
  <path d="M310 90L312 95L317 96L313 100L314 105L310 102L306 105L307 100L303 96L308 95L310 90Z" fill="#4ade80" opacity="0.7"/>

  <!-- Label Badge -->
  
  
</svg>
