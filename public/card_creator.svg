<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="bgGrad5" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#032115"/>
      <stop offset="50%" stop-color="#053b24"/>
      <stop offset="100%" stop-color="#02170e"/>
    </linearGradient>
    <linearGradient id="accentGrad5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow5" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#bgGrad5)"/>
  <path d="M0 40H400M0 80H400M0 120H400M0 160H400M0 200H400M80 0V240M160 0V240M240 0V240M320 0V240" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <circle cx="200" cy="105" r="65" fill="#22c55e" opacity="0.15" filter="url(#glow5)"/>

  <!-- Creator Camera, Ring Light & Media Badge -->
  <g transform="translate(120, 45)">
    <!-- Ring Light -->
    <circle cx="80" cy="50" r="42" stroke="url(#accentGrad5)" stroke-width="8" fill="none"/>
    <circle cx="80" cy="50" r="42" stroke="#ffffff" stroke-width="2" stroke-dasharray="6 6" fill="none" opacity="0.8"/>

    <!-- Smartphone on Tripod inside Ring Light -->
    <rect x="62" y="25" width="36" height="60" rx="6" fill="#032115" stroke="#ffffff" stroke-width="2"/>
    <circle cx="80" cy="55" r="10" fill="#22c55e"/>
    <path d="M76 50L87 55L76 60V50Z" fill="#ffffff"/>

    <!-- Recording Dot Live -->
    <circle cx="92" cy="33" r="3" fill="#ef4444"/>
  </g>

  <!-- Soundwaves / Media Accents -->
  <g transform="translate(60, 90)">
    <rect x="0" y="10" width="4" height="20" rx="2" fill="#22c55e"/>
    <rect x="8" y="0" width="4" height="40" rx="2" fill="#a855f7"/>
    <rect x="16" y="5" width="4" height="30" rx="2" fill="#22c55e"/>
  </g>
  <g transform="translate(320, 90)">
    <rect x="0" y="5" width="4" height="30" rx="2" fill="#22c55e"/>
    <rect x="8" y="0" width="4" height="40" rx="2" fill="#a855f7"/>
    <rect x="16" y="10" width="4" height="20" rx="2" fill="#22c55e"/>
  </g>

  <!-- Label Badge -->
  
  
</svg>
