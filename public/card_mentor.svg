    <path d="M40 70Q90 20 140 70" stroke="url(#accentGrad7)" stroke-width="3" stroke-dasharray="6 6"/>

    <!-- Senior Mentor Avatar Left -->
    <circle cx="40" cy="45" r="18" fill="#10b981" stroke="#ffffff" stroke-width="2"/>
    <path d="M15 85C15 65 30 60 40 60C50 60 65 65 65 85" fill="#10b981" opacity="0.8"/>
    <!-- Tie / Senior Badge -->
    <path d="M40 62L44 75L40 82L36 75Z" fill="#f59e0b"/>

    <!-- Young Leader Avatar Right -->
    <circle cx="140" cy="45" r="18" fill="#22c55e" stroke="#ffffff" stroke-width="2"/>
    <path d="M115 85C115 65 130 60 140 60C150 60 165 65 165 85" fill="#22c55e" opacity="0.8"/>

    <!-- Handshake Heart / Synergy Badge Center -->
    <g transform="translate(75, 45)">
      <circle cx="15" cy="15" r="20" fill="#032115" stroke="url(#accentGrad7)" stroke-width="3"/>
      <path d="M10 15L15 20L22 10" stroke="#22c55e" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Label Badge -->
  
  
