<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 240" fill="none">
  <defs>
    <linearGradient id="bgGrad2" x1="0" y1="0" x2="400" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#032115"/>
      <stop offset="50%" stop-color="#053b24"/>
      <stop offset="100%" stop-color="#02170e"/>
    </linearGradient>
    <linearGradient id="accentGrad2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
    <filter id="glow2" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="400" height="240" rx="16" fill="url(#bgGrad2)"/>
  <path d="M0 40H400M0 80H400M0 120H400M0 160H400M0 200H400M80 0V240M160 0V240M240 0V240M320 0V240" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>

  <circle cx="200" cy="105" r="65" fill="#22c55e" opacity="0.15" filter="url(#glow2)"/>

  <!-- Screen / Whiteboard Frame -->
  <g transform="translate(125, 45)">
    <rect width="150" height="95" rx="10" fill="#02170e" stroke="url(#accentGrad2)" stroke-width="3"/>
    <!-- Screen Header -->
    <rect width="150" height="20" rx="8" fill="#ffffff" fill-opacity="0.08"/>
    <circle cx="15" cy="10" r="3" fill="#ef4444"/>
    <circle cx="27" cy="10" r="3" fill="#eab308"/>
    <circle cx="39" cy="10" r="3" fill="#22c55e"/>

    <!-- Screen Content: Charts & Code Lines -->
    <path d="M25 45L55 35L85 55L125 30" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="125" cy="30" r="4" fill="#22c55e"/>
    
    <rect x="25" y="68" width="40" height="6" rx="3" fill="#22c55e" fill-opacity="0.8"/>
    <rect x="75" y="68" width="50" height="6" rx="3" fill="#ffffff" fill-opacity="0.3"/>
    
    <!-- Monitor Stand -->
    <path d="M65 95L55 120H95L85 95" fill="#ffffff" fill-opacity="0.1" stroke="url(#accentGrad2)" stroke-width="2"/>
    <rect x="45" y="120" width="60" height="6" rx="3" fill="url(#accentGrad2)"/>
  </g>

  <!-- Lightbulb / Idea Accent -->
  <g transform="translate(70, 70)">
    <circle cx="15" cy="15" r="12" fill="#eab308" opacity="0.8"/>
    <path d="M15 5V0M15 25V30M0 15H5M25 15H30" stroke="#fde047" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Label Badge -->
  
  
</svg>
